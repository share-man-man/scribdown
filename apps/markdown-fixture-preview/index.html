<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribdown 渲染预览</title>
  </head>
  <body class="scribdown-page">
    <!-- 关键步骤：与 VS Code / 浏览器宿主一致，正文外再包一层满宽外壳 div 作为工具栏挂载点；
         工具栏在外壳上建立 flex 布局根（.scribdown-toc-host），body 保持普通块流，
         第三方临时节点（如 mermaid 测量 div）落到 body 时不会成为 flex item 挤压正文。 -->
    <div id="scribdown-shell">
      <main class="scribdown-app">
        <article class="scribdown-markdown" id="scribdown-output"></article>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
