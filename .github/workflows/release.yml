name: Release

on:
  push:
    branches: [main]

# 串行执行，避免并发发布互相覆盖
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # changesets 推送版本提交与 git tag
  pull-requests: write # changesets 自动开 "Version Packages" PR
  id-token: write # npm provenance（可选）

jobs:
  # 版本编排 + npm 发布：开 PR 轮只更新 Version PR；发布轮发 npm 并输出 app 版本变化标记
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vscode: ${{ steps.apps.outputs.vscode }}
      browser: ${{ steps.apps.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史，供下方 git diff 检测 app 版本变化
          # 关键步骤：用 PAT 而非默认 GITHUB_TOKEN 推送 changeset-release 分支，
          # 默认 token 创建/更新的 Version PR 不会自动触发 CI（防递归保护），每轮都需手动批准。
          token: ${{ secrets.RELEASE_PAT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          registry-url: "https://registry.npmjs.org" # 写入 .npmrc，供 npm 发布鉴权
      - run: pnpm install --frozen-lockfile

      # 有未消费的 changeset → 开/更新 Version PR；
      # Version PR 合并后（无 pending changeset）→ 执行 pnpm release 发 npm。
      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: 版本编排与发布"
          title: "chore: 版本编排与发布"
        env:
          # 关键步骤：changesets/action 用 PAT 开 Version PR，使 PR 以真实用户身份创建、CI 自动触发。
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # NPM_TOKEN 供 changesets/action 识别为令牌发布；NODE_AUTH_TOKEN 供 setup-node 写入 .npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 启用 npm provenance：在 npm 页面展示「来源可验证」，依赖上方 id-token: write
          NPM_CONFIG_PROVENANCE: true

      # 通过对比合并提交前后的 app package.json version 行，判断哪个 app 需要发布。
      # app 包是 private，不依赖 changesets 的 npm published 输出，避免跳过商店发布。
      # hasChangesets == 'false' 表示本次是 Version PR 合并后的发布轮；
      # 开 PR 轮时 changesets/action 会把工作区留在 changeset-release 分支的版本 bump 提交上，
      # 不加此门禁会误判 app 版本变化、提前触发商店发布。
      - name: Detect app version changes
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: apps
        run: |
          vscode_changed=$(git diff HEAD^ HEAD -- apps/vscode-extension/package.json | grep -cE '^[+-].*"version"' || true)
          browser_changed=$(git diff HEAD^ HEAD -- apps/browser-extension/package.json | grep -cE '^[+-].*"version"' || true)
          echo "vscode=$([ "$vscode_changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "browser=$([ "$browser_changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # —— VS Code 商店 ——（与 Chrome 并行，互不阻断）
  publish-vscode:
    needs: release
    if: needs.release.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 幂等保护：Marketplace 已存在同版本时跳过，避免历史误发布导致重复发布报错
      - name: Publish VS Code Extension
        working-directory: apps/vscode-extension
        run: |
          ext_id=$(node -p "p=require('./package.json'); p.publisher + '.' + p.name")
          local_version=$(node -p "require('./package.json').version")
          published_version=$(pnpm dlx @vscode/vsce show "$ext_id" --json | jq -r '.versions[0].version // empty' || true)
          if [ "$local_version" = "$published_version" ]; then
            echo "Marketplace 已存在 $ext_id v$local_version，跳过发布"
            exit 0
          fi
          pnpm dlx @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # —— Chrome 商店 ——（与 VS Code 并行，互不阻断）
  publish-chrome:
    needs: release
    if: needs.release.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service Account 鉴权：用 SA 私钥签发 JWT，换取 chromewebstore 作用域的 access token。
      # 该 token 供下方查版本 / 上传 / 发布三步复用；写入 GITHUB_ENV 并 add-mask 避免泄露到日志。
      - name: Acquire Chrome Web Store access token
        run: |
          token=$(node --input-type=module -e '
            import { createSign } from "node:crypto";
            // 关键步骤：解析 Service Account JSON，取签名邮箱与私钥
            const sa = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_JSON);
            const now = Math.floor(Date.now() / 1000);
            /** base64url 编码 JSON 对象，用于拼接 JWT 段 */
            const enc = (obj) => Buffer.from(JSON.stringify(obj)).toString("base64url");
            const header = enc({ alg: "RS256", typ: "JWT" });
            const claim = enc({
              iss: sa.client_email,
              scope: "https://www.googleapis.com/auth/chromewebstore",
              aud: "https://oauth2.googleapis.com/token",
              iat: now,
              exp: now + 3600,
            });
            // 关键步骤：用 SA 私钥对 header.claim 做 RS256 签名，组成完整 JWT
            const signer = createSign("RSA-SHA256");
            signer.update(header + "." + claim);
            const jwt = header + "." + claim + "." + signer.sign(sa.private_key).toString("base64url");
            // 关键步骤：以 jwt-bearer 授权类型换取 access token
            const res = await fetch("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                assertion: jwt,
              }),
            });
            const data = await res.json();
            if (!res.ok) { console.error(JSON.stringify(data)); process.exit(1); }
            process.stdout.write(data.access_token);
          ')
          echo "::add-mask::$token"
          echo "CWS_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # 幂等保护：Web Store 草稿已是同版本时跳过（manifest 版本由 vite 构建时取自 package.json）
      - name: Check published version
        id: store
        run: |
          local_version=$(node -p "require('./apps/browser-extension/package.json').version")
          store_version=$(curl -sf "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID?projection=DRAFT" \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" | jq -r '.crxVersion // empty')
          echo "本地版本: $local_version，商店草稿版本: ${store_version:-<未知>}"
          echo "skip=$([ "$local_version" = "$store_version" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      - name: Publish Chrome Extension
        if: steps.store.outputs.skip != 'true'
        run: |
          pnpm --filter @scribdown/browser-extension build
          (cd apps/browser-extension/dist && zip -qr "$RUNNER_TEMP/chrome-extension.zip" .)
          # 关键步骤：上传新版本到 Web Store 草稿，校验 uploadState
          upload=$(curl -sf -X PUT \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "$RUNNER_TEMP/chrome-extension.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID")
          echo "上传结果: $upload"
          if [ "$(echo "$upload" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "上传失败" && exit 1
          fi
          # 关键步骤：发布草稿到正式环境，校验 status[0]
          publish=$(curl -sf -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID/publish")
          echo "发布结果: $publish"
          if [ "$(echo "$publish" | jq -r '.status[0] // empty')" != "OK" ]; then
            echo "发布失败" && exit 1
          fi
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
