name: Release

on:
  push:
    branches: [main]

# 串行执行，避免并发发布互相覆盖
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # changesets 推送版本提交与 git tag
  pull-requests: write # changesets 自动开 "Version Packages" PR
  id-token: write # npm provenance（可选）

jobs:
  # 版本编排 + npm 发布：开 PR 轮只更新 Version PR；发布轮发 npm 并输出 app 版本变化标记
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vscode: ${{ steps.apps.outputs.vscode }}
      browser: ${{ steps.apps.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史，供下方 git diff 检测 app 版本变化
          # 关键步骤：用 PAT 而非默认 GITHUB_TOKEN 推送 changeset-release 分支，
          # 默认 token 创建/更新的 Version PR 不会自动触发 CI（防递归保护），每轮都需手动批准。
          token: ${{ secrets.RELEASE_PAT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0" # 与 mise.toml 中的 Node.js 版本保持一致
          cache: pnpm
          registry-url: "https://registry.npmjs.org" # 写入 .npmrc，供 npm 发布鉴权
      - run: pnpm install --frozen-lockfile

      # 有未消费的 changeset → 开/更新 Version PR；
      # Version PR 合并后（无 pending changeset）→ 执行 pnpm release 发 npm。
      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: 版本编排与发布"
          title: "chore: 版本编排与发布"
        env:
          # 关键步骤：changesets/action 用 PAT 开 Version PR，使 PR 以真实用户身份创建、CI 自动触发。
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # NPM_TOKEN 供 changesets/action 识别为令牌发布；NODE_AUTH_TOKEN 供 setup-node 写入 .npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 启用 npm provenance：在 npm 页面展示「来源可验证」，依赖上方 id-token: write
          NPM_CONFIG_PROVENANCE: true

      # 通过对比合并提交前后的 app package.json version 行，判断哪个 app 需要发布。
      # app 包是 private，不依赖 changesets 的 npm published 输出，避免跳过商店发布。
      # hasChangesets == 'false' 表示本次是 Version PR 合并后的发布轮；
      # 开 PR 轮时 changesets/action 会把工作区留在 changeset-release 分支的版本 bump 提交上，
      # 不加此门禁会误判 app 版本变化、提前触发商店发布。
      - name: Detect app version changes
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: apps
        run: |
          vscode_changed=$(git diff HEAD^ HEAD -- apps/vscode-extension/package.json | grep -cE '^[+-].*"version"' || true)
          browser_changed=$(git diff HEAD^ HEAD -- apps/browser-extension/package.json | grep -cE '^[+-].*"version"' || true)
          echo "vscode=$([ "$vscode_changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "browser=$([ "$browser_changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # —— VS Code 商店 ——（与 Chrome 并行，互不阻断）
  publish-vscode:
    needs: release
    if: needs.release.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0" # 与 mise.toml 中的 Node.js 版本保持一致
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 幂等保护：Marketplace 已存在同版本时跳过，避免历史误发布导致重复发布报错
      - name: Publish VS Code Extension
        working-directory: apps/vscode-extension
        run: |
          ext_id=$(node -p "p=require('./package.json'); p.publisher + '.' + p.name")
          local_version=$(node -p "require('./package.json').version")
          published_version=$(pnpm dlx @vscode/vsce show "$ext_id" --json | jq -r '.versions[0].version // empty' || true)
          if [ "$local_version" = "$published_version" ]; then
            echo "Marketplace 已存在 $ext_id v$local_version，跳过发布"
            exit 0
          fi
          pnpm dlx @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # —— Chrome 商店 ——（与 VS Code 并行，互不阻断）
  publish-chrome:
    needs: release
    if: needs.release.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # 关键：允许获取 GitHub OIDC 令牌，供 WIF 无密钥鉴权
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0" # 与 mise.toml 中的 Node.js 版本保持一致
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 无密钥鉴权（Workload Identity Federation）：以 GitHub OIDC 令牌换取对 SA 的模拟，
      # 直接产出 chromewebstore 作用域的 access token，无需在仓库存放任何长期私钥。
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      # 幂等保护：已发布或待审版本已是本地版本时跳过（manifest 版本由 vite 构建时取自 package.json）。
      # V2 用 :fetchStatus 查条目状态，crxVersion 落在 published/submitted 两个 revision 的 distributionChannels 里。
      - name: Check published version
        id: store
        run: |
          local_version=$(node -p "require('./apps/browser-extension/package.json').version")
          item="publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID"
          # 首发条目可能无 published/submitted 记录导致 404，故不加 -f，交给 jq 兜底为“未知”
          status_json=$(curl -s "https://chromewebstore.googleapis.com/v2/$item:fetchStatus" \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN")
          # 汇总已发布与待审两个 revision 的所有渠道版本号
          store_versions=$(echo "$status_json" | jq -r '
            [(.publishedItemRevisionStatus, .submittedItemRevisionStatus) | (.distributionChannels // [])[].crxVersion]
            | unique | join(",")')
          # 本地版本命中任一已存在版本即跳过（index 命中返回下标，未命中返回 null）
          hit=$(echo "$status_json" | jq -r --arg v "$local_version" '
            [(.publishedItemRevisionStatus, .submittedItemRevisionStatus) | (.distributionChannels // [])[].crxVersion]
            | index($v)')
          echo "本地版本: $local_version，商店已有版本: ${store_versions:-<未知>}"
          echo "skip=$([ "$hit" != "null" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      - name: Publish Chrome Extension
        if: steps.store.outputs.skip != 'true'
        run: |
          pnpm --filter @scribdown/browser-extension build
          (cd apps/browser-extension/.output/chrome-mv3 && zip -qr "$RUNNER_TEMP/chrome-extension.zip" .)
          item="publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID"
          # 关键步骤：V2 媒体上传（POST + 二进制包体），校验 uploadState=SUCCEEDED
          upload=$(curl -sf -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/chrome-extension.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/$item:upload")
          echo "上传结果: $upload"
          # V2 返回 SUCCEEDED（V1 为 SUCCESS），两者都视为成功以兼容
          upload_state=$(echo "$upload" | jq -r '.uploadState // empty')
          if [ "$upload_state" != "SUCCEEDED" ] && [ "$upload_state" != "SUCCESS" ]; then
            echo "上传失败: ${upload_state:-<未知>}" && exit 1
          fi
          # 关键步骤：V2 发布（默认 DEFAULT_PUBLISH，审核通过后即上线）。
          # curl -f 已保证非 2xx 失败；发布后 state 常为待审，打印即可，不据此判失败。
          publish=$(curl -sf -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://chromewebstore.googleapis.com/v2/$item:publish")
          echo "发布结果: $publish"
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
