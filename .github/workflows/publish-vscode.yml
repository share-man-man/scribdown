name: Publish VS Code Extension

on:
  push:
    tags: ["vscode-v*"] # 例如 vscode-v0.1.0，需与 package.json 的 version 对应
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions" # 复用仓库 Node 版本基线（24.15.0）
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 发布到 VS Code Marketplace。
      # vscode:prepublish 钩子会自动先执行 build；--no-dependencies 适配 pnpm 软链结构。
      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode-extension
        run: pnpm dlx @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
