name: CI

on:
  pull_request:
  # main 的校验由 Release 调用，确保校验和发布使用同一提交，避免重复运行。
  workflow_call:

# 校验只需读取仓库，不继承发布所需的写权限。
permissions:
  contents: read

# 按调用方工作流区分并发组，避免与 Release 的串行发布组相互取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 只保留最新校验；Release 调用时由发布工作流负责串行执行。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.0" # 与 mise.toml 中的 Node.js 版本保持一致
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # 打包冒烟：确认各发布目标都能产出制品（不发布）
      - name: Pack check (npm packages)
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Package check (VS Code extension)
        working-directory: apps/vscode-extension
        # 复用 package:vsix，确保 --baseImagesUrl 与发布时一致（README 相对图片路径依赖它）
        run: pnpm run package:vsix
      - name: Package check (Chrome extension)
        run: |
          pnpm --filter @scribdown/browser-extension build
          (cd apps/browser-extension/.output/chrome-mv3 && zip -qr "$RUNNER_TEMP/chrome-extension.zip" .)
          zip -T "$RUNNER_TEMP/chrome-extension.zip"
