name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # 允许在 Actions 页面手动触发

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，自动取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 依据 package.json 的 packageManager 字段定版
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions" # 复用仓库 Node 版本基线（24.15.0）
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/* 为 JIT 内部包，无需预构建，docs 构建直接消费其源码
      - run: pnpm --filter @scribdown/docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
