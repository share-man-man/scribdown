name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      # 文档站为纯静态内容，不消费 packages/* 运行时产物，故不监听 packages 变更
      - "apps/docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # 允许在 Actions 页面手动触发

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，自动取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # 依据 package.json 的 packageManager 字段定版
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.0" # 与 mise.toml 中的 Node.js 版本保持一致
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/* 为 JIT 内部包，无需预构建，docs 构建直接消费其源码
      - run: pnpm --filter @scribdown/docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
