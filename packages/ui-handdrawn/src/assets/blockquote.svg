<svg xmlns="http://www.w3.org/2000/svg" width="980" height="93" viewBox="0 0 980 93" preserveAspectRatio="none">
  <style>
    .paper {
      fill: #FFFDF8;
    }

    .frame {
      fill: none;
      stroke: #CDBEAE;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.55;
    }

    .frame-brush {
      fill: none;
      opacity: 0.5;
      stroke: #CDBEAE;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.6;
    }

    .frame-shadow {
      fill: none;
      opacity: 0.62;
      stroke: #CDBEAE;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.35;
    }

    .frame-hairline {
      fill: none;
      opacity: 0.45;
      stroke: #CDBEAE;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.7;
    }

    .bar-fill {
      fill: #2F6A5F;
    }

    .bar-gap {
      fill: #FFFDF8;
      opacity: 0.88;
    }

    .bar-line {
      fill: none;
      opacity: 0.62;
      stroke: #2F6A5F;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.15;
    }

    @media (prefers-color-scheme: dark) {
      .paper {
        fill: #2A2420;
      }

      .frame,
      .frame-brush,
      .frame-shadow,
      .frame-hairline {
        stroke: #3D3028;
      }

      .bar-fill {
        fill: #5FBFAD;
      }

      .bar-gap {
        fill: #2A2420;
      }

      .bar-line {
        stroke: #5FBFAD;
      }
    }
  </style>
