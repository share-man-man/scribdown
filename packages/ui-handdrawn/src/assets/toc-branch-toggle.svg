<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <style>
    .ring {
      fill: none;
      opacity: 0.72;
      stroke: #2F6A5F;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.3;
    }

    .ring-dry {
