<svg xmlns="http://www.w3.org/2000/svg" width="160" height="36" viewBox="0 0 160 36" preserveAspectRatio="none">
  <style>
    .paper {
      fill: #EFE5D6;
      opacity: 0.82;
    }

    .paper-wash {
