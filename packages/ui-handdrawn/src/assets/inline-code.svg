      opacity: 0.26;
    }

    .stroke {
      fill: none;
      stroke: #B8A897;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.35;
    }

    .stroke-brush {
      fill: none;
      opacity: 0.54;
      stroke: #A99988;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.25;
    }

    .stroke-hairline {
      fill: none;
      opacity: 0.45;
      stroke: #B8A897;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.7;
    }

    .texture {
      fill: none;
      opacity: 0.22;
      stroke: #8B7C6F;
      stroke-linecap: round;
      stroke-width: 0.95;
    }

    @media (prefers-color-scheme: dark) {
      .paper {
        fill: #3A312A;
        opacity: 0.9;
      }

      .paper-wash {
        fill: #5A4A40;
        opacity: 0.24;
      }

      .stroke,
      .stroke-hairline {
        stroke: #6E5C50;
      }

      .stroke-brush {
        stroke: #7C6759;
      }

      .texture {
        stroke: #9B8C82;
        opacity: 0.18;
      }
    }
  </style>
