<svg xmlns="http://www.w3.org/2000/svg" width="96" height="8" viewBox="0 0 96 8" preserveAspectRatio="none">
  <style>
    .ink {
      fill: none;
      stroke: #5A4D45;
      stroke-width: 1.0;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-heavy {
      fill: none;
      stroke: #4A3F38;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sketch {
      fill: none;
      stroke: #6A5B53;
      opacity: 0.55;
      stroke-width: 0.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace {
      fill: none;
      stroke: #8B7C6F;
      opacity: 0.38;
      stroke-width: 0.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-color-scheme: dark) {
      .ink { stroke: #BFB0A4; }
      .ink-heavy { stroke: #D6C9BE; }
      .sketch { stroke: #9B8C82; opacity: 0.6; }
      .trace { stroke: #8B7C6F; opacity: 0.4; }
    }
  </style>

  <!-- 主笔：钢笔尖滑过纸面的核心线，高频微抖 -->
  <path class="ink" d="M-1 4.1 L3 3.85 L7 4.15 L11 3.9 L15 4.05 L19 3.8 L23 4.2 L27 3.9 L31 4.0 L35 3.85 L39 4.15 L43 3.9 L47 4.05 L51 3.8 L55 4.2 L59 3.95 L63 4.05 L67 3.85 L71 4.15 L75 3.9 L79 4.05 L83 3.85 L87 4.15 L91 3.9 L95 4.05 L97 3.95" />

  <!-- 加重段：下笔变重的部位 -->
  <path class="ink-heavy" d="M14 3.95 L18 3.9 L22 4.05" />
  <path class="ink-heavy" d="M50 3.9 L54 4.1 L58 3.95" />
  <path class="ink-heavy" d="M82 4.0 L86 3.9 L90 4.05" />

  <!-- 二次描摹：偏下，模拟反复勾勒 -->
  <path class="sketch" d="M2 4.9 L10 4.95 L18 4.6 L26 4.85 L34 4.7 L42 4.95 L50 4.6 L58 4.85 L66 4.7 L74 4.95 L82 4.6 L90 4.85 L96 4.7" />

  <!-- 三次描摹：偏上，最轻 -->
  <path class="trace" d="M4 3.15 L12 3.35 L20 3.05 L28 3.25 L36 3.0 L44 3.3 L52 3.05 L60 3.25 L68 3.0 L76 3.25 L84 3.05 L92 3.3" />
</svg>
