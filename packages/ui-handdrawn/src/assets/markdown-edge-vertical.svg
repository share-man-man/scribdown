<svg xmlns="http://www.w3.org/2000/svg" width="8" height="72" viewBox="0 0 8 72" preserveAspectRatio="none">
  <style>
    .ink {
      fill: none;
      stroke: #5A4D45;
      stroke-width: 1.0;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-heavy {
      fill: none;
      stroke: #4A3F38;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sketch {
      fill: none;
      stroke: #6A5B53;
      opacity: 0.55;
      stroke-width: 0.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace {
      fill: none;
      stroke: #8B7C6F;
      opacity: 0.38;
      stroke-width: 0.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dot {
      fill: #4A3F38;
    }

    @media (prefers-color-scheme: dark) {
      .ink { stroke: #BFB0A4; }
      .ink-heavy { stroke: #D6C9BE; }
      .sketch { stroke: #9B8C82; opacity: 0.6; }
      .trace { stroke: #8B7C6F; opacity: 0.4; }
      .dot { fill: #D6C9BE; }
    }
  </style>

  <!-- 主笔：高频微抖 -->
  <path class="ink" d="M4.1 -1 L3.85 3 L4.15 7 L3.9 11 L4.05 15 L3.8 19 L4.2 23 L3.9 27 L4.0 31 L3.85 35 L4.15 39 L3.9 43 L4.05 47 L3.8 51 L4.2 55 L3.95 59 L4.05 63 L3.85 67 L4.15 71 L3.95 73" />

  <!-- 加重段 -->
  <path class="ink-heavy" d="M3.95 14 L3.9 18 L4.05 22" />
  <path class="ink-heavy" d="M3.9 38 L4.1 42 L3.95 46" />
  <path class="ink-heavy" d="M4.0 58 L3.9 62 L4.05 66" />

  <!-- 二次描摹：偏右 -->
  <path class="sketch" d="M4.9 2 L4.95 10 L4.6 18 L4.85 26 L4.7 34 L4.95 42 L4.6 50 L4.85 58 L4.7 66 L4.95 72" />

  <!-- 三次描摹：偏左、最轻 -->
  <path class="trace" d="M3.15 4 L3.35 12 L3.05 20 L3.25 28 L3.0 36 L3.3 44 L3.05 52 L3.25 60 L3.0 68 L3.3 72" />

  <!-- 墨点：钢笔停顿处的小积墨（纵向不会被拉伸） -->
  <circle class="dot" cx="4.0" cy="16" r="0.4" />
  <circle class="dot" cx="3.9" cy="52" r="0.45" />
</svg>
