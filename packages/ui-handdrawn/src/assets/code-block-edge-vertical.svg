<svg
  width="12"
  height="144"
  viewBox="0 0 12 144"
  preserveAspectRatio="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- 轻微纸面/笔触扰动 -->
    <filter id="roughen">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="2"
        seed="8"
      />
      <feDisplacementMap
        in="SourceGraphic"
        scale="1.6"
      />
    </filter>
  </defs>

  <!-- <rect width="100%" height="100%" fill="#FAF7F0" /> -->

  <g
    fill="none"
    stroke="#1F2933"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#roughen)"
  >
    <!-- 竖线：主笔触 -->
    <path
      d="M5.9 0
         C4.6 15.2, 7.8 30.6, 5.4 45.2
         C3.6 57.0, 8.2 71.8, 5.7 86.0
         C4.1 98.2, 7.5 113.4, 5.6 126.8
         C4.8 134.8, 6.6 140.8, 5.9 144
         C4.9 106.0, 6.8 58.8, 5.9 0
         Z"
      stroke-width="2.76"
      opacity="0.9"
    />

    <!-- 竖线：副笔触，模拟重复描边 -->
    <path
      d="M8.8 0
         C7.2 16.0, 9.9 31.8, 8.2 46.8
         C6.9 58.6, 9.8 73.6, 8.0 88.8
         C6.8 101.0, 9.3 115.4, 8.0 128.8
         C7.4 136.8, 9.0 141.6, 8.5 144
         C7.4 104.8, 9.3 58.2, 8.8 0
         Z"
      stroke-width="2.6"
      opacity="0.45"
    />

    <!-- 竖线：局部厚墨，制造粗细不均匀 -->
    <path
      d="M4.8 34.0
         C5.8 42.2, 4.4 50.6, 5.3 58.4"
      stroke-width="6.0"
      opacity="0.24"
    />

    <!-- 竖线：第二段厚墨 -->
    <path
      d="M6.6 94.0
         C7.5 103.2, 6.1 112.0, 7.0 121.0"
      stroke-width="5.5"
      opacity="0.2"
    />

    <!-- 竖线：细刮痕，增加不规则层次 -->
    <path
      d="M9.7 66.0
         C8.8 74.0, 10.1 82.0, 9.2 90.0"
      stroke-width="1.2"
      opacity="0.35"
    />
  </g>
</svg>
